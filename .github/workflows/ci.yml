name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: syntax & imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile all sources
        run: python -m compileall -q src scripts

      - name: Unit tests (synthetic data, no raw dataset required)
        run: python -m pytest tests/ -q --no-header

      - name: Import smoke test
        run: >-
          python -c "from src.parsers import nasa, mit;
          from src.features.dq import dq_curve, dq_stats;
          from src.ecm import ecm;
          from src.rul import features, models;
          print('imports OK')"
